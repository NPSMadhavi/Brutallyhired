# Local infrastructure for development. Application config lives in .env.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verity}
      POSTGRES_DB: ${POSTGRES_DB:-verity}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata: {}
